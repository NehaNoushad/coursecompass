# Keeps the Supabase project from auto-pausing.
#
# Supabase's free tier pauses a project after 7 days with no activity.
# This job pings the database once a day so it always stays active — no
# manual unpausing needed. It calls the public get_visitor_count() RPC
# using the ANON key, which is safe to embed here: it's the same public
# key already shipped in the website's JavaScript, and every table is
# protected by row-level security.
#
# Note: GitHub disables scheduled workflows after 60 days with NO commits
# to the repo. As long as the project is worked on periodically that never
# triggers; if it ever goes fully dormant, one push (or a manual run via
# the Actions tab) re-arms it.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC (~10:47 AM IST)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://zgahkbpiopnrwkgdbnwu.supabase.co/rest/v1/rpc/get_visitor_count" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnYWhrYnBpb3BucndrZ2Ribnd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTQzNzUsImV4cCI6MjA5NTEzMDM3NX0.mF3DWzK_64RI0L1z0DbRCVenMUDV16ju3ukBuGe-mzg" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnYWhrYnBpb3BucndrZ2Ribnd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTQzNzUsImV4cCI6MjA5NTEzMDM3NX0.mF3DWzK_64RI0L1z0DbRCVenMUDV16ju3ukBuGe-mzg" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase responded with HTTP $code"
          # Any 2xx/4xx means the request reached the database (which is
          # what counts as activity). Only fail on network/5xx errors.
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "Ping failed"; exit 1
          fi
